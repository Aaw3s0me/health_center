{% extends "base.html" %}

{% block title %}Запись на приём — Центр здоровья «Здоровье+»{% endblock %}

{% block content %}

<section class="section">
    <div class="container">
        <div class="form-card">
            <h2>Запись на приём</h2>
            <p class="center" style="margin-bottom: 26px; color:#4a5568;">
                Заполните форму — мы свяжемся с вами для подтверждения
            </p>

            <form method="POST" action="{{ url_for('appointment') }}">
                <div class="form-group">
                    <label>Ваше имя *</label>
                    <input type="text" name="name" required placeholder="Иванов Иван">
                </div>

                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" name="phone" required placeholder="+7 (___) ___-__-__">
                </div>

                <div class="form-group">
                    <label>Услуга *</label>
                    <select name="service" required>
                        <option value="">— выберите услугу —</option>
                        {% for service in services %}
                        <option value="{{ service['name'] }}">{{ service['name'] }} — {{ service['price'] }} ₽</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Желаемая дата *</label>
                    <input type="date" name="date" required>
                </div>

                <div class="form-group">
                    <label>Комментарий</label>
                    <textarea name="comment" placeholder="Дополнительная информация (необязательно)"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;">
                    Отправить заявку
                </button>
            </form>
        </div>
    </div>
</section>

{% endblock %}
